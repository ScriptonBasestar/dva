# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Multi-Environment with env_file
#
# A plan selects its environment, and that profile sets ENV, so the compose file
# list follows the plan:
#   dva up env-aware-production --dry-run    # docker-compose.production.yml
#
# env_file cannot select per environment: dva opens each path literally, with no
# ${VAR} expansion, and skips a missing optional file without an error. Keep values
# that differ by environment in `environments:`, not in `.env.<environment>` files.
#
# OS variables override every layer, so an exported ENV also replaces the plan's
# ENV: `ENV=staging dva up env-aware-production` uses the staging compose file.

version: "0.1.44"

vars:
  APP_NAME: myapp

env_file:
  - .env.local

stack:
  compose-bundle:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
          - docker-compose.${ENV:-development}.yml

plans:
  env-aware:
    environment: development
    site: local
    entries:
      - name: compose-bundle
        runner: compose
        order: 10
  env-aware-staging:
    extends: env-aware
    environment: staging
  env-aware-production:
    extends: env-aware
    environment: production

default_plan: env-aware

environments:
  development:
    environment:
      APP_ENV: development
      ENV: development
      NODE_ENV: ${ENV}
      RAILS_ENV: ${ENV}
  staging:
    environment:
      APP_ENV: staging
      ENV: staging
      NODE_ENV: ${ENV}
      RAILS_ENV: ${ENV}
  production:
    environment:
      APP_ENV: production
      ENV: production
      NODE_ENV: ${ENV}
      RAILS_ENV: ${ENV}

sites:
  local:
    vars:
      DVA_SITE: local

interaction:
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
  shell:
    description: Open bash shell
    service: web
    command: bash
