# Project toolchain pins (mise). Keep go in sync with the go.mod `toolchain` line.
# golangci-lint is pinned to a v2 release built with a recent Go so `make lint`
# cannot hit the "built with an older Go than the target" version gate.
# gopls is pinned so `make lint` can catch the modernize-analyzer divergence
# golangci-lint's vendored copy misses (TASK-130).
#
# age is pinned because `make test-integration` runs the real binaries
# (TestConfigEnvRealSOPS): the fake runner in internal/cli can only prove what
# DVA does around the child, never that the argv DVA builds is the argv sops
# accepts. sops is deliberately absent: devenv provides it on every workstation
# (macOS brew, Linux global mise), and a pin here would shadow that copy. Its
# contract is a floor instead (minSopsVersion in internal/integration), and the
# config-env-platform CI job runs both the floor and the latest stable release.
[tools]
go = "1.27.3"
age = "1.3.1"
golangci-lint = "2.15.0"
goreleaser = "2.12.7"
"go:golang.org/x/tools/gopls" = "0.22.0"
