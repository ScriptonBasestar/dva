# Agent file-access index (ce-agent-kit decisions/025). Check a path with
# `ce access check <path>`.
#
# Every entry here is `frozen`: a generator owns the path, so an agent may read it
# but must not hand-edit it — the next run would silently discard the edit.
# `edit-instead` names the source to change.
#
# This file itself is hand-authored — nothing generates it. Add a path here only when a
# build step writes it; a file that is merely sensitive does not belong in this list,
# because the rule this encodes is "your edit will not survive", not "be careful".
#
# NOT listed, deliberately:
#   internal/cli/dva_guide_template.txt — hand-authored and git-tracked; only ai_docs.go
#     embeds it. Listing it would forbid the sole way it can be maintained.
schema-version: 1
entries:
  - path: internal/cli/library_reference.txt
    level: frozen
    reason: Generated by `make generate` from agent-mesh-flows/shared/library/ (see Makefile).
    edit-instead: agent-mesh-flows/shared/library/
  - path: .cursor/rules/
    level: frozen
    reason: Generated by tools/skillgen from skills/; gitignored and regenerated on clone.
    edit-instead: skills/
