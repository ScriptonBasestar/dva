# yaml-language-server: $schema=https://raw.githubusercontent.com/ScriptonBasestar/dva/master/internal/config/schema.json
# dva.yml — DVA CLI (Go)
# Pattern: Host Build (no Docker infrastructure)
# All commands run locally via Makefile targets
version: "0.1.44"

checks:
  - name: "Go toolchain available"
    type: command
    command: "go version > /dev/null 2>&1"
    fix_hint: "Install Go: https://go.dev/dl/"
  - name: "golangci-lint available"
    type: command
    command: "golangci-lint version > /dev/null 2>&1"
    fix_hint: "Install: https://golangci-lint.run/usage/install/"
  - name: "gopls available"
    type: command
    # Mirror Makefile:60-66 — gopls is resolved via mise first, then PATH, so a contributor who
    # has it only under mise must still pass this check (TASK-160).
    command: "{ command -v mise >/dev/null 2>&1 && mise which gopls >/dev/null 2>&1; } || command -v gopls >/dev/null 2>&1"
    fix_hint: "Install gopls (https://pkg.go.dev/golang.org/x/tools/gopls) or run 'mise install'"

interaction:
  # 'build' is a reserved DVA command — override it with a replace hook.
  # 'clean' stopped being one (docs/43): teardown is now 'dva down <plan> --purge',
  # and a flag has no interaction key to hook. It is an ordinary command here.
  build:
    replace:
      - step: "Build dva binary"
        run: "make build"

  clean:
    description: "Remove build artifacts"
    command: "make clean"
    runner: local

  install:
    description: "Install dva binary to ~/.local/share/ce/bin"
    command: "make install"
    runner: local

  generate:
    description: "Generate embedded files from workflow/"
    command: "make generate"
    runner: local

  check-generate:
    description: "Verify generated files are up to date"
    command: "make check-generate"
    runner: local

  test:
    description: "Run all tests"
    command: "make test"
    runner: local
    subcommands:
      integration:
        description: "Run integration tests"
        command: "make test-integration"
        runner: local

  lint:
    description: "Run linters (golangci-lint, gopls)"
    command: "make lint"
    runner: local

  fmt:
    description: "Format code"
    command: "make fmt"
    runner: local
    subcommands:
      files:
        description: "Format only the listed Go files"
        command: "gofmt -w -s"
        runner: local

  vet:
    description: "Run go vet"
    command: "make vet"
    runner: local

provision:
  default:
    - step: "Build binary"
      run: "make build"
    - step: "Run tests"
      run: "make test"
    - step: "Ready"
      note: "Run 'dva run install' to install to ~/.local/share/ce/bin"
  reset:
    - step: "Remove build artifacts"
      run: "make clean"
    - step: "Rebuild"
      run: "make build"

# CI orchestration is native; Make aliases only enter these profiles.
ci:
  profiles:
    dev:
      admission: {mode: when-policy-configured, class: heavy, priority: interactive, wait_timeout: 5m}
      description: Fast edit-loop checks for changed Go packages and their reverse test dependencies
      timeout: 5m
      max_parallel: 1
      steps:
        # Reuse keys (docs/75-ci-result-reuse.md). A key must name everything that can change the
        # verdict, because a stale hit is a skipped check. Every Go package and every file a
        # //go:embed can reach lives under cmd/, internal/, skills/ or tools/; "*.go" also catches
        # a Go file added anywhere else. Tools are fingerprinted by the executable mise selects,
        # so the Go toolchain and linter versions are part of the key. `mise` itself cannot be
        # declared (DVA resolves it as a shim and asks `mise which mise`, which fails); .mise.toml
        # stands in for its selection. Check a key change with `dva ci <profile> --lookup`.
        - name: format
          run: 'bad=$(gofmt -s -l .); test -z "$bad" || { printf "%s\n" "$bad"; exit 1; }'
          reuse: &reuse-format
            inputs: ["*.go"]
            tools: [gofmt]
            environment: [GOFLAGS]
            max_age: 12h
        # The validators below each take under about two seconds warm, so the edit loop runs
        # them too; core/full keep their own copies.
        - name: check-generate
          run: make check-generate
          depends_on: [format]
        - name: docs
          run: go run ./tools/doccheck && go run ./tools/cilabels && go run ./tools/flowcheck && go run ./tools/planprogress && go run ./tools/yamlcheck && go run ./tools/changelogcheck
          depends_on: [check-generate]
        - name: vet
          run: go vet ./...
          depends_on: [docs]
          reuse: &reuse-vet
            inputs: [cmd, internal, skills, tools, "*.go", go.mod, go.sum, go.work, go.work.sum, .mise.toml]
            tools: [go]
            environment: &go-env [GOFLAGS, GOTOOLCHAIN, GOROOT, GOOS, GOARCH, CGO_ENABLED, GOEXPERIMENT, GOWORK, GOPROXY, GOSUMDB]
            max_age: 12h
        - name: archcheck
          run: go run ./tools/archcheck
          depends_on: [vet]
        - name: lint-preflight
          run: sh scripts/ci-lint.sh preflight
          depends_on: [vet, archcheck]
        - name: commit-subjects
          run: go run ./tools/commitcheck
          depends_on: [lint-preflight]
        - name: affected-test
          run: 'set -eu; packages=$(go run ./tools/affectedtests --base "${DVA_BASE:?DVA_BASE=<source-ref> is required}"); test -n "$packages" || { printf "%s\n" "affectedtests selected no packages" >&2; exit 1; }; go run ./tools/cimetrics run --check dev-test -- go test -json -timeout 2m $packages'
          depends_on: [commit-subjects]
        - name: build
          run: go build -trimpath -o bin/dva ./cmd/dva
          depends_on: [affected-test]
    commit:
      admission: {mode: when-policy-configured, class: heavy, priority: interactive, wait_timeout: 5m}
      description: Staged fast checks; broad/shared changes require core/full
      warn_after: 60s
      timeout: 2m
      max_parallel: 1
      steps:
        - name: integrity
          run: go run ./tools/commitverify --phase integrity
          timeout: 45s
        - name: lint
          run: go run ./tools/commitverify --phase lint
          timeout: 60s
          depends_on: [integrity]
        - name: compile
          run: go run ./tools/commitverify --phase compile
          timeout: 60s
          depends_on: [lint]
        - name: test
          run: go run ./tools/commitverify --phase test
          timeout: 90s
          depends_on: [compile]
    core:
      admission: {mode: when-policy-configured, class: heavy, priority: background, wait_timeout: 5m}
      description: Former commit gates preserved in full (all core checks, no platform matrix)
      warn_after: 5m
      timeout: 10m
      max_parallel: 2
      steps:
        - &ci-format
          name: format
          run: 'bad=$(gofmt -s -l .); test -z "$bad" || { printf "%s\n" "$bad"; exit 1; }'
          reuse: *reuse-format
        - &ci-docs
          name: docs
          run: go run ./tools/doccheck && go run ./tools/cilabels && go run ./tools/flowcheck && go run ./tools/planprogress && go run ./tools/yamlcheck && go run ./tools/changelogcheck
          depends_on: [check-generate]
        # check-generate rewrites generated files before comparing them, so the steps that read
        # those files (docs, vet) wait for it instead of racing it.
        - &ci-check-generate
          name: check-generate
          run: make check-generate
          depends_on: [format]
        - &ci-vet
          name: vet
          run: go vet ./...
          depends_on: [check-generate]
          reuse: *reuse-vet
        - &ci-archcheck
          name: archcheck
          run: go run ./tools/archcheck
          depends_on: [vet]
        # lint-preflight keeps no reuse: its subject is the go/GOROOT pairing that mise exec
        # builds from machine-wide mise state, which no declared input can fingerprint.
        - &ci-lint-preflight
          name: lint-preflight
          run: sh scripts/ci-lint.sh preflight
          depends_on: [vet, archcheck]
        - &ci-lint-golangci
          name: lint-golangci
          run: sh scripts/ci-lint.sh golangci
          depends_on: [lint-preflight]
          reuse:
            inputs: [cmd, internal, skills, tools, "*.go", go.mod, go.sum, go.work, go.work.sum, .mise.toml, .golangci.yml, scripts/ci-lint.sh]
            tools: [sh, go, golangci-lint]
            # GOLANGCI_LINT_CACHE is in the key so pointing it at an empty dir to force a cold
            # run never gets a hit recorded under the warm cache.
            environment: [GOFLAGS, GOTOOLCHAIN, GOROOT, GOOS, GOARCH, CGO_ENABLED, GOEXPERIMENT, GOWORK, GOPROXY, GOSUMDB, GOLANGCI_LINT_CACHE]
            max_age: 12h
        - &ci-lint-gopls
          name: lint-gopls
          run: sh scripts/ci-lint.sh gopls
          depends_on: [lint-golangci]
          reuse:
            inputs: [cmd, internal, skills, tools, "*.go", go.mod, go.sum, go.work, go.work.sum, .mise.toml, scripts/ci-lint.sh]
            tools: [sh, go, gopls]
            environment: *go-env
            max_age: 12h
        - &ci-test
          name: test
          run: 'fresh=; if [ "$DVA_CI_FRESH" = 1 ]; then fresh=-count=1; fi; go run ./tools/cimetrics run --check unit -- go test -json $fresh -timeout 5m -race -cover ./...'
          environment:
            GOMAXPROCS: "2"
            GOFLAGS: "-p=2"
          depends_on: [docs, lint-gopls]
        - &ci-build
          name: build
          run: go build -trimpath -o bin/dva ./cmd/dva
          depends_on: [test]
    full:
      admission: {mode: when-policy-configured, class: heavy, priority: background, wait_timeout: 5m}
      description: Core gates plus integration and built-binary skill dogfood; Linux/release checks remain hosted, macOS uses its explicit local profile
      timeout: 30m
      warn_after: 15m
      max_parallel: 2
      steps: &full-steps
        - *ci-format
        - *ci-docs
        - *ci-check-generate
        - *ci-vet
        - *ci-archcheck
        - *ci-lint-preflight
        - *ci-lint-golangci
        - *ci-lint-gopls
        - *ci-test
        - *ci-build
        - name: integration
          run: 'fresh=; if [ "$DVA_CI_FRESH" = 1 ]; then fresh=-count=1; fi; go run ./tools/cimetrics run --check integration -- go test -json $fresh -tags=integration -race -timeout 10m ./internal/integration/...'
          depends_on: [build]
        - name: skill-dogfood
          run: 'fresh=; if [ "$DVA_CI_FRESH" = 1 ]; then fresh=-count=1; fi; DVA_DOGFOOD_BIN="$PWD/bin/dva" go run ./tools/cimetrics run --check skill-dogfood -- go test -json $fresh -run "^TestBuiltExecutableDogfood$" ./tools/skilldogfood'
          depends_on: [integration]
        - name: commit-subjects
          run: go run ./tools/commitcheck
          depends_on: [skill-dogfood]
    audit:
      admission: {mode: when-policy-configured, class: heavy, priority: background, wait_timeout: 5m}
      description: Full checks with successful result reuse disabled
      timeout: 30m
      warn_after: 15m
      max_parallel: 2
      fresh: true
      steps: *full-steps
    macos-platform:
      admission: {mode: when-policy-configured, class: heavy, priority: background, wait_timeout: 5m}
      description: Explicit native macOS platform checks with prepared SOPS floor/latest tools
      timeout: 20m
      max_parallel: 1
      steps:
        - name: preflight
          run: bash scripts/local-macos-platform.sh preflight
          timeout: 1m
        - name: platform-unit
          run: bash scripts/local-macos-platform.sh unit
          environment: &macos-go-env
            GOMAXPROCS: "2"
            GOFLAGS: "-p=2"
          timeout: 5m
          depends_on: [preflight]
        - name: integration-floor
          run: bash scripts/local-macos-platform.sh integration floor
          environment: *macos-go-env
          timeout: 5m
          depends_on: [platform-unit]
        - name: integration-latest
          run: bash scripts/local-macos-platform.sh integration latest
          environment: *macos-go-env
          timeout: 5m
          depends_on: [integration-floor]
